<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking – Cozy Threads Laundry</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>

<body>

<!-- NAV -->
<nav>
    <div class="logo">Cozy Threads</div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="services.html">Our Services</a></li>
        <li><a href="booking.html">Booking</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<!-- HERO -->
<section class="contact-hero">
    <h1>Book a Laundry Service</h1>
    <p>Fast • Reliable • Affordable</p>
</section>

<!-- BOOKING FORM -->
<div class="booking-section">
    <h2>Laundry Service Booking Form</h2>

    <form id="bookingForm">

        <label>Your Full Name</label>
        <input type="text" name="name" required>

        <label>Your Phone Number</label>
        <input type="text" name="phone" required>

        <label>Select Service</label>
        <select name="service" required>
            <option value="">Choose service</option>
            <option>Wash Only</option>
            <option>Wash & Fold</option>
            <option>Wash, Fold & Iron</option>
            <option>Small Basket – R110</option>
            <option>Medium Basket – R150</option>
            <option>Large Basket – R200</option>
        </select>

        <label>Pickup or Drop-off?</label>
        <select name="method" required>
            <option value="">Choose option</option>
            <option>Pickup</option>
            <option>Drop-off</option>
        </select>

        <label>Your Address (for pickup)</label>
        <input type="text" name="address">

        <label>Date Needed</label>
        <input type="date" name="date" required>

        <label>Notes (optional)</label>
        <textarea name="notes" rows="4"></textarea>

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:15px;">
            <i class="fa-solid fa-paper-plane"></i> Submit Booking
        </button>
    </form>

    <div id="successMessage" class="success-message">
        Booking sent successfully! We will contact you shortly.
    </div>
</div>

<footer>
    © 2026 Cozy Threads – Winter Essentials & Laundry Services
</footer>

<script>
(function() {
    emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); 
})();

document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault();

    emailjs.sendForm("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", this)
        .then(() => {
            document.getElementById("successMessage").style.display = "block";
            this.reset();
        })
        .catch((error) => {
            alert("Error sending booking: " + error);
        });
});
</script>

</body>
</html>
