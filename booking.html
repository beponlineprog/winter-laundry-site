<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking System</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="logo">Cozy Threads</div>
</nav>

<header class="page-header">
    <h1>Booking System</h1>
    <p>Choose a service below</p>
</header>

<section class="form-grid">

    <!-- ================= LAUNDRY FORM ================= -->
    <div class="form-card">
        <h2>🧺 Laundry Booking</h2>

        <input id="l_name" type="text" placeholder="Full Name" required>
        <input id="l_phone" type="tel" placeholder="Phone Number" required>
        <input id="l_email" type="email" placeholder="Email (optional)">

        <select id="l_service">
            <option>Small Basket – R110</option>
            <option>Medium Basket – R150</option>
            <option>Large Basket – R200</option>
            <option>Wash Only</option>
            <option>Wash & Fold</option>
            <option>Wash, Fold & Iron</option>
        </select>

        <input id="l_date" type="date">

        <textarea id="l_notes" placeholder="Additional notes"></textarea>

        <button onclick="sendLaundry()" class="btn">Submit Laundry Booking</button>
    </div>

    <!-- ================= WINTER FORM ================= -->
    <div class="form-card">
        <h2>❄ Winter Essentials Order</h2>

        <input id="w_name" type="text" placeholder="Full Name" required>
        <input id="w_phone" type="tel" placeholder="WhatsApp Number" required>

        <div class="check-group">
            <label><input class="w_item" type="checkbox" value="No-show Socks"> No-show Socks</label>
            <label><input class="w_item" type="checkbox" value="Warm Gloves"> Warm Gloves</label>
            <label><input class="w_item" type="checkbox" value="Thick Long Socks"> Thick Long Socks</label>
            <label><input class="w_item" type="checkbox" value="Beanies"> Beanies</label>
            <label><input class="w_item" type="checkbox" value="Umbrellas"> Umbrellas</label>
        </div>

        <textarea id="w_notes" placeholder="Quantity & Notes"></textarea>

        <button onclick="sendWinter()" class="btn">Submit Winter Order</button>
    </div>

</section>

<!-- ================= SCRIPT ================= -->
<script>
function sendLaundry() {
    let msg =
`🧺 LAUNDRY BOOKING
Name: ${l_name.value}
Phone: ${l_phone.value}
Email: ${l_email.value}
Service: ${l_service.value}
Date: ${l_date.value}
Notes: ${l_notes.value}`;

    window.open("https://wa.me/27788190578?text=" + encodeURIComponent(msg));
}

function sendWinter() {

    let items = [];
    document.querySelectorAll(".w_item:checked")
    .forEach(i => items.push(i.value));

    let msg =
`❄ WINTER ORDER
Name: ${w_name.value}
Phone: ${w_phone.value}
Items:
- ${items.join("\n- ")}
Notes: ${w_notes.value}`;

    window.open("https://wa.me/27788190578?text=" + encodeURIComponent(msg));
}
</script>

</body>
</html>
