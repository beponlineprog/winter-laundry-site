
<!-- ================= BOOKING HEADER ================= -->
<section class="content">
    <h2>Booking</h2>
    <p>Book your laundry service or winter essentials via WhatsApp or call us directly.</p>
</section>

<!-- ================= BOOKING FORMS ================= -->
<section class="form-grid">

    <!-- LAUNDRY FORM -->
    <div class="form-card">

        <h2>🧺 Laundry Booking</h2>

        <div class="form-group">
            <input id="l_name" type="text" placeholder="Full Name" required>
        </div>

        <div class="form-group">
            <input id="l_phone" type="tel" placeholder="Phone Number" required>
        </div>

        <div class="form-group">
            <input id="l_email" type="email" placeholder="Email (optional)">
        </div>

        <div class="form-group">
            <select id="l_service" required>
                <option value="">Select Service</option>
                <option>Small Basket – R110</option>
                <option>Medium Basket – R150</option>
                <option>Large Basket – R200</option>
            </select>
        </div>

        <div class="form-group">
            <input id="l_date" type="date" required>
        </div>

        <div class="form-group">
            <textarea id="l_notes" placeholder="Additional Notes (optional)"></textarea>
        </div>

        <button type="button" onclick="sendLaundry()" class="btn-primary">
            Submit Laundry Booking
        </button>

    </div>

    <!-- WINTER FORM -->
    <div class="form-card">

        <h2>❄ Winter Essentials Order</h2>

        <div class="form-group">
            <input id="w_name" type="text" placeholder="Full Name" required>
        </div>

        <div class="form-group">
            <input id="w_phone" type="tel" placeholder="WhatsApp Number" required>
        </div>

        <div class="form-group checkbox-group">

            <label><input class="w_item" type="checkbox" value="No-show Socks"> No-show Socks</label>
            <label><input class="w_item" type="checkbox" value="Warm Gloves"> Warm Gloves</label>
            <label><input class="w_item" type="checkbox" value="Thick Socks"> Thick Socks</label>
            <label><input class="w_item" type="checkbox" value="Beanies"> Beanies</label>
            <label><input class="w_item" type="checkbox" value="Umbrellas"> Umbrellas</label>

        </div>

        <div class="form-group">
            <textarea id="w_notes" placeholder="Quantity / Notes (optional)"></textarea>
        </div>

        <button type="button" onclick="sendWinter()" class="btn-primary">
            Submit Winter Order
        </button>

    </div>

</section>
